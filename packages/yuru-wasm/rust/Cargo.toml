[package]
name = "yuru-wasm-kernel"
version = "0.0.1"
edition = "2021"
license = "MIT"
publish = false

[lib]
crate-type = [ "cdylib" ]

[dependencies]
dlmalloc = { version = "0.2.14", features = [ "global" ] }
# Keep the crate and CLI schema aligned with the Nix dev shell.
wasm-bindgen = { version = "=0.2.121", default-features = false }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

[package.metadata.wasm-pack.profile.release]
wasm-opt = [
  "-O3",
  "--enable-simd",
  "--enable-bulk-memory-opt",
  "--enable-nontrapping-float-to-int",
]
